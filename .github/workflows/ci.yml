# CI leve em Ubuntu hospedado pelo GitHub: governança, formatação Rust e frontend.
# A validação nativa é local, fora do GitHub Actions, em conta Windows de teste isolada.
# Comandos locais: cargo +stable check --workspace --locked; cargo +stable test --workspace --locked.
# Executar também o build Tauri e os testes manuais de WebView, links e banco de dados.
# Teste local do cofre (conta de teste): cargo +stable test -p tina --locked windows_vault_creates_256_bit_key_and_requires_password_after_restart -- --ignored --nocapture
# Pull requests empilhados também são validados nas respectivas branches-base.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Required governance files exist and are non-empty
        shell: pwsh
        run: |
          $required = @(
            'README.md', 'CONTRIBUTING.md', 'SECURITY.md', 'NOTICE', 'LICENSING.md', '.gitignore',
            'docs/integrity/POLICY.md', 'docs/spec/000-requisitos-funcionais.md',
            'docs/spec/out-of-scope.md', 'docs/provenance/POLICY.md', 'docs/provenance/REGISTER.md'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item -LiteralPath $file -Force).Length -eq 0) {
              throw "falta ou esta vazio: $file"
            }
          }

      - name: No LICENSE file until the owner decides
        shell: pwsh
        run: |
          foreach ($file in @('LICENSE', 'LICENSE.md', 'LICENSE.txt', 'COPYING')) {
            if (Test-Path -LiteralPath $file -PathType Leaf) {
              throw "arquivo de licenca presente ($file) antes da decisao do proprietario"
            }
          }

      - name: No secret-like files are tracked
        shell: pwsh
        run: |
          # Node preserves NUL-delimited Git paths, including spaces and Unicode.
          node -e "const {execFileSync}=require('node:child_process');const paths=execFileSync('git',['ls-files','-z']).toString('utf8').split('\0');const re=/(^|\/)(\.env(\..+)?|.+\.(pem|key|ppk|p12|pfx|jks|keystore))$/i;const bad=paths.filter(p=>re.test(p));if(bad.length){console.error('arquivos com nome/formato de segredo rastreados:',bad);process.exit(1)}"
          if ($LASTEXITCODE -ne 0) { throw 'falha na verificacao de nomes de arquivos' }

      - name: Secret-like content scan (tracked and staged)
        shell: pwsh
        run: |
          $pattern = '(-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,})'
          # List only filenames, never matching secret values.
          $working = @(git grep -I -l -E -e $pattern --)
          $workingExit = $LASTEXITCODE
          $staged = @(git grep --cached -I -l -E -e $pattern --)
          $stagedExit = $LASTEXITCODE
          if ($workingExit -gt 1 -or $stagedExit -gt 1) {
            throw 'falha ao executar a verificacao de conteudo'
          }
          if ($workingExit -eq 0 -or $stagedExit -eq 0) {
            $hits = @($working + $staged | Sort-Object -Unique)
            $hits | ForEach-Object { Write-Host "conteudo com formato de segredo: $_" }
            throw 'conteudo com formato de segredo encontrado'
          }
          exit 0

  rust-format:
    name: Rust formatting
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install rustfmt
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
      - name: Check formatting
        run: cargo +stable fmt --all -- --check

  frontend:
    name: Svelte frontend validation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Node dependencies
        run: npm ci

      - name: Check Svelte and TypeScript
        run: npm run frontend:check

      - name: Build frontend
        run: npm run frontend:build

      - name: Run frontend regression tests
        run: npm run frontend:test
