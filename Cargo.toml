[workspace]
members = ["src-tauri"]
resolver = "2"

[package]
name = "tina"
version = "0.1.0"
edition = "2021"
authors = ["Tina Team <team@tina.local>"]
description = "Núcleo local da plataforma Tina"
license = "MIT"
repository = "https://github.com/vihisantos/Tina-Gestao-InterPessoal"
readme = "README.md"

[lib]
name = "tina"
path = "src/lib.rs"

# Dependências mínimas para o bootstrap da Fase 1.
# Módulos de fases futuras permanecem no repositório, mas não são compilados
# até serem efetivamente implementados e declarados em src/lib.rs.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
