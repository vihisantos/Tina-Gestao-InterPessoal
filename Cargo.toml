[workspace]
members = ["src-tauri"]
resolver = "2"

[package]
name = "tina"
version = "0.1.0"
edition = "2021"
authors = ["Tina Team <team@tina.local>"]
description = "Núcleo local da plataforma Tina"
license = "MIT"
repository = "https://github.com/vihisantos/Tina-Gestao-InterPessoal"
readme = "README.md"

[lib]
name = "tina"
path = "src/lib.rs"

# Dependências mínimas para o bootstrap da Fase 1.
# Módulos de fases futuras permanecem no repositório, mas não são compilados
# até serem efetivamente implementados e declarados em src/lib.rs.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock", "std"] }
env_logger = "0.11"
argon2 = "0.5.3"
aes-gcm = "0.10"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util", "net", "io-util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
